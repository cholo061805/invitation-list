<!-- Greetings for Vea: paste into an Elementor "HTML" widget (set the page to Canvas / Full Width), or open this file in a browser. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap');
.gv,.gv *{box-sizing:border-box}
.gv{position:relative;overflow:hidden;min-height:640px;font-family:'Poppins',Arial,sans-serif;color:#3b2a5a;background:linear-gradient(160deg,#ff6fb5 0%,#8a5cf6 55%,#3b82f6 100%)}
.gv h1{margin:0;font-family:'Pacifico',cursive;font-weight:400;line-height:1.2;color:#fff;text-shadow:0 5px 18px rgba(0,0,0,.25)}
/* balloons */
.gv .bl{position:absolute;bottom:-140px;left:var(--x);width:52px;height:66px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);opacity:.85;animation:gv-up var(--d) linear infinite;animation-delay:var(--l);pointer-events:none}
.gv .bl:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(255,255,255,.7)}
@keyframes gv-up{to{transform:translateY(-900px) rotate(8deg)}}
/* stage with the gift */
.gv .stage{position:relative;z-index:2;min-height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:#fff;transition:opacity .6s ease}
.gv .stage h1{font-size:clamp(34px,7vw,60px)}
.gv .stage p{margin:10px 0 0;font-size:18px}
.gv .gift{position:relative;width:200px;height:200px;margin:34px 0 18px;cursor:pointer;outline:none;animation:gv-bob 2s ease-in-out infinite}
.gv .gift:focus-visible{box-shadow:0 0 0 4px #ffe066;border-radius:12px}
@keyframes gv-bob{50%{transform:translateY(-10px)}}
.gv .box{position:absolute;bottom:0;left:10px;right:10px;height:140px;border-radius:8px 8px 14px 14px;background:#ffd6e7;box-shadow:0 18px 30px rgba(0,0,0,.25)}
.gv .box:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;margin-left:-17px;background:#ffe066}
.gv .lid{position:absolute;bottom:134px;left:0;right:0;height:50px;border-radius:10px;background:#ff8fbd;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s}
.gv .lid:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;margin-left:-17px;background:#ffe066}
.gv .lid:after{content:"\2740";position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:46px;line-height:1;color:#ffe066}
.gv .gift.shake{animation:gv-shake .5s ease}
@keyframes gv-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.gv .gift.open{animation:none}
.gv .gift.open .lid{transform:translateY(-150px) rotate(-14deg);opacity:0}
.gv .stage.gone{opacity:0;pointer-events:none;position:absolute;inset:0}
/* greetings */
.gv .reveal{position:relative;z-index:2;display:none;padding:60px 20px 50px;text-align:center;color:#fff}
.gv .reveal.show{display:block}
.gv .reveal h1{font-size:clamp(40px,9vw,76px);animation:gv-pop .8s ease both}
.gv .nm{margin:6px 0 0;font-size:clamp(24px,5vw,40px);font-weight:600;letter-spacing:6px;color:#ffe066;animation:gv-pop .8s ease .15s both}
.gv .sub{max-width:520px;margin:14px auto 34px;animation:gv-pop .8s ease .3s both}
@keyframes gv-pop{from{opacity:0;transform:scale(.8) translateY(16px)}to{opacity:1;transform:none}}
.gv .wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:900px;margin:0 auto;text-align:left}
.gv .g{padding:22px;border-radius:16px;background:#fff;color:#3b2a5a;line-height:1.6;border-top:5px solid var(--c,#ff6fb5);box-shadow:0 10px 26px rgba(40,10,90,.25);opacity:0;animation:gv-card .6s ease forwards;animation-delay:var(--dl)}
.gv .g b{display:block;margin-top:12px;font-size:14px;color:var(--c,#ff6fb5)}
@keyframes gv-card{from{opacity:0;transform:translateY(24px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.gv .wall.one{display:block;max-width:640px}
.gv .note{padding:36px 32px;border-radius:18px;background:#fff;color:#3b2a5a;border-top:6px solid #ff6fb5;box-shadow:0 14px 34px rgba(40,10,90,.28);animation:gv-card .6s ease .7s both}
.gv .note p{margin:0 0 16px;font-size:18px;line-height:1.8;opacity:0;animation:gv-card .7s ease forwards;animation-delay:var(--dl)}
.gv .note p:first-child{font-family:'Pacifico',cursive;font-size:28px;color:#8a5cf6}
.gv .note p.sig{margin:22px 0 0;font-family:'Pacifico',cursive;font-size:24px;color:#ff6fb5;text-align:right}
.gv .end{margin-top:34px;font-family:'Pacifico',cursive;font-size:clamp(22px,4vw,30px);opacity:0;animation:gv-pop .8s ease forwards;animation-delay:var(--end)}
.gv .again{margin-top:18px;padding:11px 26px;border:0;border-radius:40px;background:#ffe066;color:#4a2a86;font:600 15px 'Poppins',Arial,sans-serif;cursor:pointer;opacity:0;animation:gv-pop .8s ease forwards;animation-delay:var(--end)}
/* confetti */
.gv .p{position:absolute;top:-14px;width:10px;height:16px;z-index:6;pointer-events:none;animation:gv-fall 3s ease-in forwards}
@keyframes gv-fall{to{transform:translateY(900px) rotate(720deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.gv .bl,.gv .gift,.gv .p{animation:none!important}.gv .g,.gv .note,.gv .note p,.gv .reveal h1,.gv .nm,.gv .sub,.gv .end,.gv .again{animation-duration:.01s!important;animation-delay:0s!important}}
</style>

<div class="gv" id="gv">
  <span class="bl" style="--x:6%;--c:#ffe066;--d:11s;--l:0s"></span>
  <span class="bl" style="--x:22%;--c:#7dd3fc;--d:14s;--l:2s"></span>
  <span class="bl" style="--x:40%;--c:#fca5a5;--d:12s;--l:4s"></span>
  <span class="bl" style="--x:64%;--c:#86efac;--d:13s;--l:1s"></span>
  <span class="bl" style="--x:80%;--c:#fde68a;--d:10s;--l:3s"></span>
  <span class="bl" style="--x:92%;--c:#c4b5fd;--d:15s;--l:5s"></span>

  <section class="stage" id="gvStage">
    <h1 id="gvHello">Hi, Vea!</h1>
    <p>You have a surprise waiting for you.</p>
    <div class="gift" id="gvGift" role="button" tabindex="0" aria-label="Open your gift">
      <div class="lid"></div>
      <div class="box"></div>
    </div>
    <p><b>Tap the gift to open it</b></p>
  </section>

  <section class="reveal" id="gvReveal">
    <h1>Happy Birthday</h1>
    <div class="nm" id="gvName">VEA</div>
    <p class="sub">I have a few words just for you.</p>
    <div class="wall" id="gvWall"></div>
    <div class="end" id="gvEnd">Enjoy your special day!</div>
    <button class="again" id="gvAgain" type="button">Open again</button>
  </section>
</div>

<script>
(function(){
  /* ===== EDIT THESE ===== */
  var CELEBRANT = "Vea";
  var SENDER = "Your Name";           /* your name, shown at the end of the letter */
  var GREETING = [                    /* each line is one paragraph; add or remove lines freely */
    "Happy birthday, Vea!",
    "I hope this year brings you good health, happiness, and everything you have been wishing for.",
    "Thank you for being such a special part of my life. I'm so grateful for you, today and always.",
    "Enjoy your day and eat lots of cake!"
  ];
  /* ====================== */

  function $(id){ return document.getElementById(id); }
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x)e.textContent=x; return e; }

  var root = $('gv'), stage = $('gvStage'), reveal = $('gvReveal'), gift = $('gvGift'), wall = $('gvWall');
  var cols = ['#ffe066','#7dd3fc','#fca5a5','#86efac','#ffffff','#c4b5fd','#ff6fb5'];
  var busy = false;

  $('gvHello').textContent = 'Hi, ' + CELEBRANT + '!';
  $('gvName').textContent = CELEBRANT.toUpperCase();

  function burst(n){
    for (var i = 0; i < n; i++) {
      var p = el('span','p');
      p.style.left = Math.random()*100 + '%';
      p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random()*0.7) + 's';
      p.style.animationDuration = (2.4 + Math.random()*1.6) + 's';
      root.appendChild(p);
      setTimeout((function(x){ return function(){ x.remove(); }; })(p), 5000);
    }
  }

  function build(){
    wall.textContent = '';
    wall.className = 'wall one';
    var note = el('div','note');
    GREETING.forEach(function(t, i){
      var p = el('p','', t);
      p.style.setProperty('--dl', (1.0 + i*0.7) + 's');
      note.appendChild(p);
    });
    var sig = el('p','sig','With love, ' + SENDER);
    sig.style.setProperty('--dl', (1.0 + GREETING.length*0.7) + 's');
    note.appendChild(sig);
    wall.appendChild(note);
    var end = (1.0 + GREETING.length*0.7 + 0.9) + 's';
    $('gvEnd').style.setProperty('--end', end);
    $('gvAgain').style.setProperty('--end', end);
  }

  function openGift(){
    if (busy) return;
    busy = true;
    gift.classList.add('shake');
    setTimeout(function(){
      gift.classList.remove('shake');
      gift.classList.add('open');
      burst(110);
    }, 550);
    setTimeout(function(){
      stage.classList.add('gone');
      build();
      reveal.classList.add('show');
      root.scrollIntoView({behavior:'smooth', block:'start'});
      burst(70);
    }, 1700);
  }

  function reset(){
    reveal.classList.remove('show');
    stage.classList.remove('gone');
    gift.classList.remove('open');
    busy = false;
  }

  gift.addEventListener('click', openGift);
  gift.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });
  $('gvAgain').addEventListener('click', reset);
})();
</script>
